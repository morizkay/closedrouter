# ClosedRouter runtime configuration
# Copy to config.yaml or set CLOSEDROUTER_CONFIG.

host: "0.0.0.0"
port: 8080
database_path: "./data/closedrouter.db"
# admin_token: "replace-me"
cors_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"
  - "http://localhost:5173"
  - "http://127.0.0.1:5173"

# Seeded only when the catalog is empty (first boot).
providers:
  - name: Ollama
    kind: openai
    base_url: "http://127.0.0.1:11434/v1"
    models:
      - id: llama3
        upstream_model: llama3.2
        display_name: Llama 3
