services:
  gateway:
    build:
      context: .
      dockerfile: crates/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/closedrouter.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-now}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RUST_LOG: ${RUST_LOG:-info}
      CLOSEDROUTER_CONFIG: /etc/closedrouter/config.yaml
    volumes:
      - closedrouter-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  closedrouter-data:
